<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>주민참여예산 관리자</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    >
    <link rel="stylesheet" href="./admin.css">
    <link rel="stylesheet" href="./participatory-budget-admin.css">
  </head>
  <body>
    <header class="admin-topbar">
      <div class="container-fluid px-3 px-lg-4">
        <div class="d-flex align-items-center justify-content-between gap-3">
          <div>
            <p class="admin-kicker mb-1">Participatory Budget Admin</p>
            <h1 class="admin-title mb-0">주민참여예산 관리자</h1>
          </div>
          <a class="btn btn-outline-secondary btn-sm icon-button" href="./participatory-budget.html" target="_blank" rel="noopener noreferrer">
            <i data-lucide="external-link" aria-hidden="true"></i>
            <span>공개 미리보기</span>
          </a>
        </div>
      </div>
    </header>

    <nav class="admin-section-nav" aria-label="관리 영역">
      <div class="container-fluid px-3 px-lg-4">
        <div class="admin-section-tabs">
          <a href="./admin.html">운영 히스토리</a>
          <a href="./agenda-admin.html">의제 장터</a>
          <a class="is-active" href="./participatory-budget-admin.html" aria-current="page">주민참여예산</a>
          <a href="./council-admin.html">시의회 모니터링</a>
        </div>
      </div>
    </nav>

    <main class="admin-shell">
      <div class="container-fluid px-3 px-lg-4">
        <div id="budgetConfigNotice" class="alert alert-warning d-none" role="alert">Supabase 설정을 확인해 주세요.</div>
        <div id="budgetAdminStatus" class="admin-status" role="status" aria-live="polite"></div>

        <section id="budgetAuthSection" class="auth-layout">
          <div class="admin-panel auth-panel">
            <h2 class="panel-title mb-3">관리자 로그인</h2>
            <form id="budgetLoginForm">
              <div class="mb-3">
                <label class="form-label" for="budgetLoginEmail">이메일</label>
                <input id="budgetLoginEmail" class="form-control" type="email" autocomplete="username" required>
              </div>
              <div class="mb-3">
                <label class="form-label" for="budgetLoginPassword">비밀번호</label>
                <input id="budgetLoginPassword" class="form-control" type="password" autocomplete="current-password" required>
              </div>
              <button id="budgetLoginButton" class="btn btn-primary icon-button" type="submit">
                <i data-lucide="log-in" aria-hidden="true"></i>
                <span>로그인</span>
              </button>
            </form>
          </div>
        </section>

        <section id="budgetAdminSection" class="d-none">
          <div class="panel-toolbar">
            <strong id="budgetRecordCountText">현재 0개의 제안이 있습니다.</strong>
            <div class="d-flex flex-wrap gap-2">
              <button id="budgetRefreshButton" class="btn btn-outline-secondary btn-sm icon-button" type="button">
                <i data-lucide="refresh-cw" aria-hidden="true"></i>
                <span>새로고침</span>
              </button>
              <button id="budgetLogoutButton" class="btn btn-outline-secondary btn-sm icon-button" type="button">
                <i data-lucide="log-out" aria-hidden="true"></i>
                <span>로그아웃</span>
              </button>
            </div>
          </div>

          <div class="budget-admin-grid">
            <aside class="admin-panel list-panel">
              <div class="panel-toolbar">
                <h2 class="panel-title">제안 목록</h2>
                <button id="budgetNewRecordButton" class="btn btn-primary btn-sm icon-button" type="button">
                  <i data-lucide="plus" aria-hidden="true"></i>
                  <span>새 제안</span>
                </button>
              </div>
              <label class="budget-admin-search">
                <span class="visually-hidden">관리 사업 검색</span>
                <i data-lucide="search" aria-hidden="true"></i>
                <input id="budgetAdminSearch" type="search" placeholder="제안명, 지역, 분야 검색">
              </label>
              <div id="budgetRecordList" class="record-list"></div>
            </aside>

            <section class="admin-panel edit-panel">
              <form id="budgetRecordForm">
                <div class="panel-toolbar">
                  <div>
                    <h2 id="budgetFormTitle" class="panel-title">새 제안</h2>
                    <p id="budgetFormSubtitle" class="panel-copy mb-0">저장 전</p>
                  </div>
                  <div class="d-flex flex-wrap gap-2">
                    <button id="budgetDeleteButton" class="btn btn-outline-danger btn-sm icon-button d-none" type="button">
                      <i data-lucide="trash-2" aria-hidden="true"></i>
                      <span>삭제</span>
                    </button>
                    <button id="budgetSaveButton" class="btn btn-primary btn-sm icon-button" type="submit">
                      <i data-lucide="save" aria-hidden="true"></i>
                      <span>저장</span>
                    </button>
                  </div>
                </div>

                <input id="budgetRecordId" type="hidden">
                <div class="row g-3">
                  <div class="col-12 col-md-4">
                    <label class="form-label" for="budgetFiscalYear">사업연도</label>
                    <input id="budgetFiscalYear" class="form-control" type="number" min="2000" max="2200" required>
                  </div>
                  <div class="col-12 col-md-4">
                    <label class="form-label" for="budgetProposalDate">제안일</label>
                    <input id="budgetProposalDate" class="form-control" type="date">
                  </div>
                  <div class="col-12 col-md-4">
                    <label class="form-label" for="budgetPublished">공개 상태</label>
                    <select id="budgetPublished" class="form-select">
                      <option value="true">공개</option>
                      <option value="false">비공개</option>
                    </select>
                  </div>

                  <div class="col-12">
                    <label class="form-label" for="budgetProjectName">제안명</label>
                    <input id="budgetProjectName" class="form-control" type="text" maxlength="255" required>
                  </div>

                  <div class="col-12 col-md-6">
                    <label class="form-label" for="budgetDistrict">지역</label>
                    <input id="budgetDistrict" class="form-control" type="text" maxlength="100" placeholder="예: 처인구 남사읍">
                  </div>
                  <div class="col-12 col-md-6">
                    <label class="form-label" for="budgetCategory">분야</label>
                    <input id="budgetCategory" class="form-control" type="text" maxlength="100" list="budgetCategoryOptions" placeholder="예: 교통">
                    <datalist id="budgetCategoryOptions">
                      <option value="교통"></option>
                      <option value="환경"></option>
                      <option value="복지"></option>
                      <option value="안전"></option>
                      <option value="문화·체육"></option>
                      <option value="교육"></option>
                      <option value="지역경제"></option>
                    </datalist>
                  </div>
                  <div class="col-12">
                    <label class="form-label" for="budgetDescription">제안 내용</label>
                    <textarea id="budgetDescription" class="form-control" rows="6"></textarea>
                  </div>
                  <div class="col-12">
                    <label class="form-label" for="budgetPublicNote">공개 보충 설명</label>
                    <textarea id="budgetPublicNote" class="form-control" rows="5" placeholder="제안 배경이나 추가로 공개할 내용"></textarea>
                  </div>
                  <div class="col-12">
                    <label class="form-label" for="budgetInternalNote">내부 검토 메모</label>
                    <textarea id="budgetInternalNote" class="form-control" rows="5" placeholder="관리자에게만 보이는 메모"></textarea>
                    <p class="panel-copy mb-0">공개 화면의 조회 항목에서 제외됩니다.</p>
                  </div>
                  <div class="col-12">
                    <label class="form-label" for="budgetSourceUrl">관련 자료 URL</label>
                    <input id="budgetSourceUrl" class="form-control" type="url" placeholder="https://">
                  </div>
                </div>
              </form>
            </section>
          </div>
        </section>
      </div>
    </main>

    <script
      src="https://unpkg.com/lucide@1.20.0/dist/umd/lucide.min.js"
      integrity="sha384-vEpkK5oidsrH6UhRc6tAPlgJZ/qXFwumFY+Kx8vBSeZ7NBag809YZCSmxFYGe/pt"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="./participatory-budget-admin.js"></script>
  </body>
</html>
