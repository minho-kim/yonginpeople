<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>의제 장터 관리자</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    >
    <link rel="stylesheet" href="./admin.css">
    <link rel="stylesheet" href="./agenda-admin.css">
  </head>
  <body>
    <header class="admin-topbar">
      <div class="container-fluid">
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-2">
          <div>
            <p class="admin-kicker mb-1">Agenda Market Admin</p>
            <h1 class="admin-title mb-0">의제 장터 관리자</h1>
          </div>
          <div class="d-flex flex-wrap align-items-center gap-2">
            <a class="btn btn-outline-primary btn-sm icon-button" href="./admin.html">
              <i data-lucide="history" aria-hidden="true"></i>
              <span>히스토리 관리</span>
            </a>
            <a class="btn btn-outline-secondary btn-sm icon-button" href="./agendas.html">
              <i data-lucide="external-link" aria-hidden="true"></i>
              <span>의제 공개 화면</span>
            </a>
            <button id="logoutButton" class="btn btn-outline-danger btn-sm icon-button d-none" type="button">
              <i data-lucide="log-out" aria-hidden="true"></i>
              <span>로그아웃</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <main class="container-fluid admin-shell">
      <div id="adminStatus" class="admin-status" role="status" aria-live="polite"></div>

      <section id="configNotice" class="admin-panel d-none">
        <h2 class="panel-title">Supabase 설정 필요</h2>
        <p class="panel-copy mb-0">config.js의 공개 키 설정을 확인해 주세요.</p>
      </section>

      <section id="authSection" class="auth-layout">
        <form id="loginForm" class="admin-panel auth-panel">
          <h2 class="panel-title">관리자 로그인</h2>
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label" for="loginEmail">이메일</label>
              <input id="loginEmail" class="form-control" type="email" autocomplete="email" required>
            </div>
            <div class="col-12">
              <label class="form-label" for="loginPassword">비밀번호</label>
              <input id="loginPassword" class="form-control" type="password" autocomplete="current-password" required>
            </div>
            <div class="col-12">
              <button id="loginButton" class="btn btn-primary icon-button w-100" type="submit">
                <i data-lucide="log-in" aria-hidden="true"></i>
                <span>로그인</span>
              </button>
            </div>
          </div>
        </form>
      </section>

      <section id="adminSection" class="d-none">
        <div class="row g-3 align-items-start">
          <aside class="col-12 col-lg-4">
            <div class="admin-panel list-panel">
              <div class="panel-toolbar">
                <div>
                  <h2 class="panel-title mb-1">의제 목록</h2>
                  <p id="recordCountText" class="panel-copy mb-0">0개</p>
                </div>
                <div class="d-flex gap-2">
                  <button id="newRecordButton" class="btn btn-outline-primary btn-sm icon-only" type="button" aria-label="새 의제" title="새 의제">
                    <i data-lucide="plus" aria-hidden="true"></i>
                  </button>
                  <button id="refreshButton" class="btn btn-outline-secondary btn-sm icon-only" type="button" aria-label="새로고침" title="새로고침">
                    <i data-lucide="refresh-cw" aria-hidden="true"></i>
                  </button>
                </div>
              </div>
              <div id="recordList" class="record-list"></div>
            </div>
          </aside>

          <section class="col-12 col-lg-8">
            <form id="agendaForm" class="admin-panel edit-panel">
              <div class="panel-toolbar">
                <div>
                  <h2 id="formTitle" class="panel-title mb-1">새 의제</h2>
                  <p id="formSubtitle" class="panel-copy mb-0">저장 전</p>
                </div>
                <div class="d-flex flex-wrap gap-2">
                  <button id="deleteButton" class="btn btn-outline-danger btn-sm icon-button d-none" type="button">
                    <i data-lucide="trash-2" aria-hidden="true"></i>
                    <span>삭제</span>
                  </button>
                  <button id="saveButton" class="btn btn-primary btn-sm icon-button" type="submit">
                    <i data-lucide="save" aria-hidden="true"></i>
                    <span>저장</span>
                  </button>
                </div>
              </div>

              <input id="recordId" type="hidden">

              <div class="row g-3">
                <div class="col-12 col-md-4">
                  <label class="form-label" for="proposedDate">제안 접수일</label>
                  <input id="proposedDate" class="form-control" type="date" required>
                </div>
                <div class="col-12 col-md-4">
                  <label class="form-label" for="agendaStatus">진행 상태</label>
                  <select id="agendaStatus" class="form-select" required>
                    <option value="proposed">제안 접수</option>
                    <option value="recruiting">참여자 모집</option>
                    <option value="discussing">논의 중</option>
                    <option value="shared">운영위 공유</option>
                    <option value="completed">논의 완료</option>
                    <option value="dropped">논의 중단</option>
                  </select>
                </div>
                <div class="col-12 col-md-4">
                  <label class="form-label" for="agendaCategory">분야</label>
                  <input id="agendaCategory" class="form-control" type="text" maxlength="80" placeholder="예: 교통, 돌봄, 환경">
                </div>

                <div class="col-12">
                  <label class="form-label" for="agendaTitle">의제 제목</label>
                  <input id="agendaTitle" class="form-control" type="text" maxlength="255" required>
                </div>
                <div class="col-12">
                  <label class="form-label" for="agendaSummary">한 줄 요약</label>
                  <textarea id="agendaSummary" class="form-control" rows="2" maxlength="500"></textarea>
                </div>
                <div class="col-12">
                  <label class="form-label" for="agendaDescription">상세 내용</label>
                  <textarea id="agendaDescription" class="form-control" rows="6"></textarea>
                </div>
                <div class="col-12">
                  <label class="form-label" for="statusNote">상태 메모 또는 중단 이유</label>
                  <textarea id="statusNote" class="form-control" rows="3"></textarea>
                </div>

                <div class="col-12 col-md-7">
                  <div class="d-flex align-items-center justify-content-between gap-2 mb-2">
                    <label class="form-label mb-0" for="participants">공개 참여자</label>
                    <strong id="participantCountPreview" class="participant-count-preview">0/3명</strong>
                  </div>
                  <textarea id="participants" class="form-control" rows="5" placeholder="이름을 한 줄에 한 명씩 입력"></textarea>
                  <p class="form-note mb-0">공개에 동의한 이름만 입력합니다.</p>
                </div>
                <div class="col-12 col-md-5">
                  <label class="form-label" for="agendaTags">검색 태그</label>
                  <textarea id="agendaTags" class="form-control" rows="5" placeholder="교통, 기흥구, 보행"></textarea>
                  <p class="form-note mb-0">쉼표 또는 줄바꿈으로 구분합니다.</p>
                </div>

                <div class="col-12">
                  <div class="agenda-admin-section-heading">
                    <div>
                      <h3>다음 모임</h3>
                    </div>
                  </div>
                  <div class="row g-2">
                    <div class="col-12 col-md-4">
                      <label class="visually-hidden" for="nextMeetingDate">다음 모임 날짜</label>
                      <input id="nextMeetingDate" class="form-control" type="date" aria-label="다음 모임 날짜">
                    </div>
                    <div class="col-12 col-md-3">
                      <label class="visually-hidden" for="nextMeetingTime">다음 모임 시간</label>
                      <input id="nextMeetingTime" class="form-control" type="time" aria-label="다음 모임 시간">
                    </div>
                    <div class="col-12 col-md-5">
                      <label class="visually-hidden" for="nextMeetingLocation">다음 모임 장소</label>
                      <input id="nextMeetingLocation" class="form-control" type="text" maxlength="255" placeholder="장소" aria-label="다음 모임 장소">
                    </div>
                  </div>
                </div>

                <div class="col-12">
                  <div class="agenda-admin-section-heading">
                    <div>
                      <h3>빌드업 기록</h3>
                    </div>
                    <button id="addUpdateButton" class="btn btn-outline-secondary btn-sm icon-button" type="button">
                      <i data-lucide="plus" aria-hidden="true"></i>
                      <span>기록 추가</span>
                    </button>
                  </div>
                  <div id="updateRows" class="agenda-update-rows"></div>
                </div>
              </div>
            </form>
          </section>
        </div>
      </section>
    </main>

    <script
      src="https://unpkg.com/lucide@1.20.0/dist/umd/lucide.min.js"
      integrity="sha384-vEpkK5oidsrH6UhRc6tAPlgJZ/qXFwumFY+Kx8vBSeZ7NBag809YZCSmxFYGe/pt"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="./agenda-admin.js"></script>
  </body>
</html>
