name: Supabase Daily Health Check

on:
  schedule:
    - cron: "17 9 * * *"
      timezone: "Asia/Seoul"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-daily-health-check
  cancel-in-progress: false

jobs:
  check-public-data-api:
    name: Check public Supabase tables
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://dkutzurwvvluzouwujvu.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Query public data tables
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${SUPABASE_PUBLISHABLE_KEY}" ]]; then
            echo "::error title=Missing GitHub Actions secret::SUPABASE_PUBLISHABLE_KEY is not configured."
            exit 1
          fi

          check_table() {
            local table_name="$1"
            local response_file
            local http_status

            response_file="$(mktemp)"
            http_status="$(
              curl \
                --silent \
                --show-error \
                --location \
                --max-time 20 \
                --retry 2 \
                --retry-all-errors \
                --output "$response_file" \
                --write-out "%{http_code}" \
                "${SUPABASE_URL}/rest/v1/${table_name}?select=id&limit=1" \
                --header "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
                --header "Authorization: Bearer ${SUPABASE_PUBLISHABLE_KEY}"
            )"

            if [[ "$http_status" != "200" ]]; then
              echo "::error title=Supabase health check failed::${table_name} returned HTTP ${http_status}."
              cat "$response_file"
              rm -f "$response_file"
              return 1
            fi

            if ! jq -e 'type == "array"' "$response_file" >/dev/null; then
              echo "::error title=Invalid Supabase response::${table_name} did not return a JSON array."
              rm -f "$response_file"
              return 1
            fi

            echo "${table_name}: OK"
            rm -f "$response_file"
          }

          check_table "timeline_history"
          check_table "agendas"
          check_table "participatory_budget_projects"
