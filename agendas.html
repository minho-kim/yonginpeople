<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>의제 장터 | 용인 시민 100인 연석회의</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    >
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./agendas.css">
  </head>
  <body>
    <main class="page-shell">
      <section class="intro-section agenda-intro-section">
        <div class="container">
          <div class="row align-items-end gy-3">
            <div class="col-12 col-lg-8">
              <p class="section-kicker mb-2">Open Agenda Market</p>
              <h1 class="display-title mb-3">의제 장터</h1>
              <p class="intro-copy mb-0">연석회의에서 제안되고 논의된 의제가 어떻게 자라왔는지 기록합니다.</p>
            </div>
            <div class="col-12 col-lg-4">
              <div id="agendaDataStatus" class="data-status" role="status" aria-live="polite"></div>
            </div>
          </div>
        </div>
      </section>

      <nav class="page-tabs-section" aria-label="공개 화면 이동">
        <div class="container">
          <div class="page-tabs">
            <a class="page-tab" href="./index.html">운영 히스토리</a>
            <a class="page-tab is-active" href="./agendas.html" aria-current="page">의제 장터</a>
            <a class="page-tab" href="./participatory-budget.html">주민참여예산</a>
          </div>
        </div>
      </nav>

      <section class="agenda-section">
        <div class="container">
          <div class="agenda-summary-band" aria-label="의제 현황">
            <div class="agenda-summary-item">
              <span class="agenda-summary-label">전체 기록</span>
              <strong id="totalAgendaCount">0</strong>
            </div>
            <div class="agenda-summary-item">
              <span class="agenda-summary-label">현재 논의 중</span>
              <strong id="activeAgendaCount">0</strong>
            </div>
            <div class="agenda-summary-item">
              <span class="agenda-summary-label">논의 중단</span>
              <strong id="droppedAgendaCount">0</strong>
            </div>
          </div>

          <div class="agenda-filter-bar">
            <div class="agenda-search-wrap">
              <i data-lucide="search" aria-hidden="true"></i>
              <label class="visually-hidden" for="agendaSearchInput">의제 검색</label>
              <input
                id="agendaSearchInput"
                class="agenda-search-input"
                type="search"
                placeholder="제목, 내용, 참여자, 과거 기록 검색"
                autocomplete="off"
              >
            </div>
            <div class="agenda-filter-actions">
              <label class="visually-hidden" for="agendaStatusFilter">진행 상태</label>
              <select id="agendaStatusFilter" class="form-select agenda-status-filter">
                <option value="all">전체</option>
                <option value="discussing">논의 중</option>
                <option value="dropped">논의 중단</option>
              </select>
              <button id="agendaFilterReset" class="agenda-reset-button" type="button" aria-label="검색 조건 초기화" title="검색 조건 초기화">
                <i data-lucide="rotate-ccw" aria-hidden="true"></i>
              </button>
            </div>
          </div>

          <p id="agendaResultText" class="agenda-result-text" aria-live="polite"></p>

          <div id="agendaGrid" class="agenda-grid" aria-live="polite">
            <div class="agenda-loading">
              <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">로딩 중</span>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p class="site-footer-copy">
          <span>사이트 이용 불편 신고, 문의: 김민호(개발자)</span>
          <a href="tel:+821025135736">010-2513-5736</a>
          <span aria-hidden="true">/</span>
          <a href="mailto:kimminho0914@gmail.com">kimminho0914@gmail.com</a>
        </p>
      </div>
    </footer>

    <script
      src="https://unpkg.com/lucide@1.20.0/dist/umd/lucide.min.js"
      integrity="sha384-vEpkK5oidsrH6UhRc6tAPlgJZ/qXFwumFY+Kx8vBSeZ7NBag809YZCSmxFYGe/pt"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="./agendas.js"></script>
  </body>
</html>
