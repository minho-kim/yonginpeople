    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    >
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./participatory-budget.css">
  </head>
  <body>
    <main class="page-shell">
      <section class="intro-section budget-intro-section">
        <div class="container">
          <div class="row align-items-end gy-3">
            <div class="col-12 col-lg-8">
              <p class="section-kicker mb-2">Participatory Budget</p>
              <h1 class="display-title mb-3">주민참여예산</h1>
              <p class="intro-copy mb-0">주민참여예산 제도와 시민이 제안한 지역사업 아이디어를 기록합니다.</p>
            </div>
            <div class="col-12 col-lg-4">
              <div id="budgetDataStatus" class="data-status" role="status" aria-live="polite"></div>
            </div>
          </div>
        </div>
      </section>

      <nav class="page-tabs-section" aria-label="공개 화면 이동">
        <div class="container">
          <div class="page-tabs">
            <a class="page-tab" href="./index.html">운영 히스토리</a>
            <a class="page-tab" href="./agendas.html">의제 장터</a>
            <a class="page-tab is-active" href="./participatory-budget.html" aria-current="page">주민참여예산</a>
            <a class="page-tab" href="./council-monitoring.html">시의회 모니터링</a>
          </div>
        </div>
      </nav>

      <section class="budget-section">
        <div class="container">
          <div class="budget-guide">
            <h2>주민참여예산이란?</h2>
            <p>주민이 지역에 필요한 사업을 직접 제안하고 예산 편성 과정에 참여하는 제도입니다. 이곳에는 용인 시민이 발견한 지역의 문제와 해결 아이디어를 기록합니다.</p>
          </div>

          <div class="budget-summary-band" aria-label="주민참여예산 현황">
            <div class="budget-summary-item">
              <span>전체 제안</span>
              <strong id="budgetProjectCount">0</strong>
            </div>
            <div class="budget-summary-item">
              <span>사업연도</span>
              <strong id="budgetYearCount">0</strong>
            </div>
            <div class="budget-summary-item">
              <span>제안 지역</span>
              <strong id="budgetDistrictCount">0</strong>
            </div>
          </div>

          <div class="budget-filter-bar">
            <div class="budget-search-wrap">
              <i data-lucide="search" aria-hidden="true"></i>
              <label class="visually-hidden" for="budgetSearchInput">주민참여예산 검색</label>
              <input
                id="budgetSearchInput"
                type="search"
                placeholder="제안명, 지역, 분야, 내용 검색"
                autocomplete="off"
              >
            </div>
            <div class="budget-filter-grid">
              <label>
                <span>사업연도</span>
                <select id="budgetYearFilter" class="form-select">
                  <option value="">전체 연도</option>
                </select>
              </label>
              <label>
                <span>지역</span>
                <select id="budgetDistrictFilter" class="form-select">
                  <option value="">전체 지역</option>
                </select>
              </label>
              <label>
                <span>분야</span>
                <select id="budgetCategoryFilter" class="form-select">
                  <option value="">전체 분야</option>
                </select>
              </label>
              <button id="budgetFilterReset" class="budget-reset-button" type="button" title="검색 조건 초기화" aria-label="검색 조건 초기화">
                <i data-lucide="rotate-ccw" aria-hidden="true"></i>
              </button>
            </div>
          </div>

          <p id="budgetResultText" class="budget-result-text" aria-live="polite"></p>
          <div id="budgetGrid" class="budget-grid" aria-live="polite">
            <div class="budget-loading">
              <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">로딩 중</span>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p class="site-footer-copy">
          <span>사이트 이용 불편 신고, 문의: 김민호(개발자)</span>
          <a href="tel:+821025135736">010-2513-5736</a>
          <span aria-hidden="true">/</span>
          <a href="mailto:kimminho0914@gmail.com">kimminho0914@gmail.com</a>
        </p>
      </div>
    </footer>

    <script
      src="https://unpkg.com/lucide@1.20.0/dist/umd/lucide.min.js"
      integrity="sha384-vEpkK5oidsrH6UhRc6tAPlgJZ/qXFwumFY+Kx8vBSeZ7NBag809YZCSmxFYGe/pt"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="./participatory-budget.js"></script>
  </body>
</html>
